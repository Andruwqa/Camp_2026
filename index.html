<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание кэмпа</title>
<link rel="preload" href="fonts/steppe-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/steppe-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/kurochka-lapkoi.woff2" as="font" type="font/woff2" crossorigin>
<!-- ?v= — метка версии: меняется при каждом обновлении, чтобы браузеры не держали старые файлы -->
<link rel="stylesheet" href="app.css?v=2026-10-18-3">
</head>
<body>

<header class="bar" id="bar">
  <div class="bar-in">
    <nav class="chips" id="chips" aria-label="Дни кэмпа"></nav>
    <label class="live">
      <span class="live-text">Текущее время</span>
      <input class="live-input" id="live" type="checkbox" role="switch" checked>
      <span class="live-track" aria-hidden="true"></span>
    </label>
  </div>
</header>
<main id="days"></main>
<button class="nowbtn" id="nowbtn" type="button" hidden></button>

<script src="schedule.js?v=2026-10-18-3"></script>
<script src="app.js?v=2026-10-18-3"></script>
</body>
</html>
