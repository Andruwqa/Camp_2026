<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание кэмпа</title>
<link rel="icon" href="favicon.svg?v=2026-10-18-2" type="image/svg+xml">
<link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/caveat-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<!-- ?v= — метка версии: меняется при каждом обновлении, чтобы браузеры не держали старые файлы -->
<link rel="stylesheet" href="app.css?v=2026-10-23-1">
</head>
<body>

<header class="bar" id="bar">
  <div class="bar-in">
    <nav class="chips" id="chips" aria-label="Дни кэмпа"></nav>
    <!-- Тогл «Следить» скрыт; чтобы вернуть, достаточно раскомментировать.
    <label class="live">
      <span class="live-text">Следить</span>
      <input class="live-input" id="live" type="checkbox" role="switch" checked>
      <span class="live-track" aria-hidden="true"></span>
    </label>
    -->
  </div>
</header>
<main id="days"></main>
<button class="nowbtn" id="nowbtn" type="button" hidden></button>

<script src="schedule.js?v=2026-10-19-2"></script>
<script src="app.js?v=2026-10-19-1"></script>
<!-- Счётчик посещений GoatCounter: статистика на pushinandrej.goatcounter.com -->
<script data-goatcounter="https://pushinandrej.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
